# RoCE NetworkAttachmentDefinitions for PSAP B200 cluster
# Maps abstract roce-net-N names to physical interfaces:
#   roce-net-0 → ens40f0np0 (GPU0, VLAN 101)
#   roce-net-1 → ens42f0np0 (GPU0, VLAN 109)
#   roce-net-2 → ens41f0np0 (GPU1, VLAN 102)
#   roce-net-3 → ens38f0np0 (GPU2, VLAN 103)
#   roce-net-4 → ens37f0np0 (GPU3, VLAN 104)
#   roce-net-5 → ens32f0np0 (GPU4, VLAN 105)
#   roce-net-6 → ens31f0np0 (GPU5, VLAN 106)
#   roce-net-7 → ens36f0np0 (GPU6, VLAN 107)
#   roce-net-8 → ens34f0np0 (GPU6, VLAN 110)
#   roce-net-9 → ens35f0np0 (GPU7, VLAN 108)
#
# Usage: kubectl apply -f roce-net-nads-psap-b200.yaml -n <namespace>
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: roce-net-0
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "roce-net-0",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ens40f0np0",
          "mode": "bridge",
          "mtu": 1500,
          "ipam": {
            "type": "nv-ipam",
            "poolName": "pool-ens40f0np0"
          }
        },
        {
          "type": "sbr-custom",
          "gateway": "172.16.101.254",
          "preserveDefaultRoutes": true
        }
      ]
    }
---
